# Quantumult X - Google One AI page response rewrite
# Paste these lines into the corresponding sections of your existing profile.
# MITM HTTPS decryption must be enabled and its certificate trusted.
# The URL rule matches /ai ONLY when a query string is present.

[rewrite_local]
^https://one\.google\.com/ai\?.*$ url script-response-body https://raw.githubusercontent.com/sumuen/googleoneqx/main/scripts/google-one.js

[mitm]
hostname = %APPEND% one.google.com
